[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.dependencies]
gpui = { git = "https://github.com/zed-industries/zed", branch = "main", features = ["wayland"] }
gpui_platform = { git = "https://github.com/zed-industries/zed", branch = "main", features = ["wayland"] }
ui = { path = "crates/ui" }
assets = { path = "crates/assets" }
services = { path = "crates/services" }

anyhow = "1.0"
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "time", "sync", "process"] }
futures-util = { version = "0.3", default-features = false }
futures-signals = "0.3"
inotify = "0.11"
zbus = "5.16"
serde = { version = "1.0", features = ["derive"] }
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
itertools = "0.15"
chrono = "0.4"
hyprland = "0.4.0-beta.3"
niri-ipc = "26.4"
serde_json = "1.0"
image = { version = "0.25", default-features = false }

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
incremental = false
opt-level = "z"
strip = true
rpath = false
debug = false
debug-assertions = false
overflow-checks = false
