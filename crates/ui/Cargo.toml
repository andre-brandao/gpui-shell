[package]
name = "ui"
version = "0.1.0"
edition = "2024"

[lib]
name = "ui"
path = "src/ui.rs"

[dependencies]
gpui.workspace = true
anyhow.workspace = true
serde_json.workspace = true
serde = { version = "1.0", features = ["derive"] }
tracing.workspace = true
smallvec = "1"
strum = { version = "0.27", features = ["derive"] }
unicode-segmentation = "1"
lyon = "1.0"

[dev-dependencies]
toml = "1.1"
